<!DOCTYPE html>

<html lang="ko" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>별모도로 - 목표 설정</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandYellow: '#FFEF4D',
            brandDark: '#000000',
            brandSlate: '#23272F',
            brandMuted: '#7C828D',
            brandText: '#EEF0F3',
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['"Archivo Narrow"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>
<!-- CSS Styles -->
<style data-purpose="custom-layout">
    /* Prevent default elastic scrolling & assure 390x844 mobile viewport */
    html, body {
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #app-container {
      width: 390px;
      height: 844px;
      max-height: 844px;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    /* Tab glow styling */
    .active-tab-glow {
      box-shadow: 0 0 12px rgba(255, 239, 77, 0.45);
    }

    /* Ambient Dial Glow */
    .dial-halo-glow {
      filter: blur(28px);
      background: radial-gradient(circle, rgba(255, 239, 77, 0.16) 0%, rgba(255, 239, 77, 0.05) 50%, transparent 70%);
    }

    /* Diagonal stripe pattern for 5-min rest section */
    .rest-stripe-pattern {
      fill: url(#diagonalHatch);
    }

    /* Precision crosshair corner markers for primary button */
    .crosshair-corner {
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      color: #FFEF4D;
    }
    .crosshair-tl { top: -6px; left: -6px; }
    .crosshair-tr { top: -6px; right: -6px; }
    .crosshair-bl { bottom: -6px; left: -6px; }
    .crosshair-br { bottom: -6px; right: -6px; }
  </style>
</head>
<body>
<!-- BEGIN: MainContainer -->
<div class="flex flex-col justify-between items-center px-4 py-0" data-purpose="mobile-screen-wrapper" id="app-container"><!-- Top Header & Card Selection Section -->
<div class="w-full max-w-[358px] flex flex-col pt-10">
<!-- Header Section -->
<div class="flex flex-col mb-7"><h1 class="text-[24px] font-bold text-[#EEF0F3] leading-snug tracking-normal">목표를 정해 주세요</h1>
<p class="text-[14px] text-[#949AA6] mt-2 tracking-normal">세트를 마칠 때마다 별자리가 조금씩 차올라요</p></div>
<!-- Constellation Selection Cards List -->
<div class="flex flex-col gap-5 w-full">
<!-- Section A: 기간 selection -->
<div class="flex flex-col">
<span class="text-[13px] font-medium text-[#949AA6] mb-2">기간</span>
<div class="grid grid-cols-2 gap-2.5 w-full">
<button class="w-full py-3 bg-[#FFEF4D] text-[#000000] font-bold text-[15px] rounded-xl text-center focus:outline-none transition-colors cursor-pointer" type="button">하루</button>
<button class="w-full py-3 border border-[#7C828D]/45 text-[#EEF0F3] font-medium text-[15px] rounded-xl text-center focus:outline-none transition-colors cursor-pointer" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%);" type="button">한 주</button>
</div>
</div>
<!-- Section B: 세트 수 selection -->
<div class="flex flex-col">
<span class="text-[13px] font-medium text-[#949AA6] mb-2">세트 수</span>
<div class="grid grid-cols-4 gap-2 w-full">
<button class="w-full py-3 border border-[#7C828D]/45 text-[#EEF0F3] font-medium text-[15px] rounded-xl text-center focus:outline-none transition-colors cursor-pointer" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%);" type="button">2세트</button>
<button class="w-full py-3 border-2 border-[#FFEF4D] text-[#FFEF4D] font-bold text-[15px] rounded-xl text-center shadow-[0_0_16px_rgba(255,239,77,0.15)] focus:outline-none transition-colors cursor-pointer" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%);" type="button">3세트</button>
<button class="w-full py-3 border border-[#7C828D]/45 text-[#EEF0F3] font-medium text-[15px] rounded-xl text-center focus:outline-none transition-colors cursor-pointer" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%);" type="button">4세트</button>
<button class="w-full py-3 border border-[#7C828D]/45 text-[#EEF0F3] font-medium text-[15px] rounded-xl text-center focus:outline-none transition-colors cursor-pointer" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%);" type="button">5세트</button>
</div>
<p class="text-[13px] text-[#949AA6] mt-2">하루 3세트 · 약 1시간 30분</p>
</div>
<!-- Section C: 첫 별자리 preview card -->
<div class="w-full rounded-2xl p-4 border border-[#7C828D]/45 flex flex-col" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%);">
<span class="text-[12px] font-medium text-[#949AA6] mb-3 leading-none">첫 별자리</span>
<div class="flex items-center gap-4">
<!-- Orion Constellation Drawing -->
<div class="w-[76px] h-[76px] rounded-xl bg-[#090B0E] flex items-center justify-center flex-shrink-0 border border-[#2B303A]">
<svg fill="none" height="64" viewbox="0 0 64 64" width="64" xmlns="http://www.w3.org/2000/svg">
<!-- Hourglass & Belt Connecting Lines -->
<line stroke="rgba(124,130,141,0.35)" stroke-width="1.2" x1="18" x2="46" y1="14" y2="18"></line>
<line stroke="rgba(124,130,141,0.35)" stroke-width="1.2" x1="18" x2="28" y1="14" y2="32"></line>
<line stroke="rgba(124,130,141,0.35)" stroke-width="1.2" x1="46" x2="36" y1="18" y2="32"></line>
<line stroke="rgba(124,130,141,0.5)" stroke-width="1.2" x1="28" x2="32" y1="32" y2="32"></line>
<line stroke="rgba(124,130,141,0.5)" stroke-width="1.2" x1="32" x2="36" y1="32" y2="32"></line>
<line stroke="rgba(124,130,141,0.35)" stroke-width="1.2" x1="28" x2="20" y1="32" y2="50"></line>
<line stroke="rgba(124,130,141,0.35)" stroke-width="1.2" x1="36" x2="44" y1="32" y2="48"></line>
<line stroke="rgba(124,130,141,0.35)" stroke-width="1.2" x1="20" x2="44" y1="50" y2="48"></line>
<!-- Betelgeuse (Red tint) -->
<circle cx="18" cy="14" fill="#FFA099" filter="drop-shadow(0 0 4px rgba(255,122,122,0.8))" r="3.5"></circle>
<!-- Bellatrix -->
<circle cx="46" cy="18" fill="#EEF0F3" r="2.5"></circle>
<!-- Belt Stars (Alnitak, Alnilam, Mintaka) -->
<circle cx="28" cy="32" fill="#EEF0F3" r="2"></circle>
<circle cx="32" cy="32" fill="#EEF0F3" r="2"></circle>
<circle cx="36" cy="32" fill="#EEF0F3" r="2"></circle>
<!-- Saiph -->
<circle cx="20" cy="50" fill="#D1D5DB" r="2.5"></circle>
<!-- Rigel (Blue tint) -->
<circle cx="44" cy="48" fill="#9BC2FF" filter="drop-shadow(0 0 4px rgba(122,184,255,0.8))" r="3.5"></circle>
</svg>
</div>
<!-- Constellation Details -->
<div class="flex flex-col">
<span class="text-[18px] font-bold text-[#EEF0F3] leading-snug">오리온자리</span>
<p class="text-[13px] text-[#949AA6] mt-1 leading-snug">세트를 마칠 때마다 앞 별부터 차올라요</p>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Primary CTA Button Section -->
<div class="w-full max-w-[358px] pb-9 flex flex-col items-center">
<div class="relative w-full h-[52px]">
<!-- Nocturne Focus Corner Plus (+) Indicators -->
<span aria-hidden="true" class="crosshair-corner crosshair-tl">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-tr">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-bl">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-br">+</span>
<!-- Main CTA Button -->
<button class="w-full h-full bg-[#FFEF4D] text-[#000000] font-bold text-[16px] tracking-normal flex items-center justify-center rounded-none active:bg-[#e6d843] transition-colors focus:outline-none cursor-pointer" type="button">이 목표로 시작하기</button>
</div>
</div></div>
<!-- END: MainContainer -->
</body></html>
