<style>
    body {
      background-color: #000000;
      color: #EEF0F3;
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .font-num {
      font-family: 'Archivo Narrow', sans-serif;
    }
    .glow-star {
      filter: drop-shadow(0 0 12px rgba(255, 239, 77, 0.85)) drop-shadow(0 0 24px rgba(255, 239, 77, 0.45));
    }
    .halo-radial {
      background: radial-gradient(circle, rgba(255, 239, 77, 0.18) 0%, rgba(255, 239, 77, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
    }
    .outer-halo-radial {
      background: radial-gradient(circle, rgba(255, 239, 77, 0.08) 0%, rgba(255, 239, 77, 0.02) 60%, rgba(0, 0, 0, 0) 100%);
    }
    .card-gradient {
      background: linear-gradient(180deg, #161c25 0%, #0e141c 100%);
    }

      box-shadow: 0 0 24px -2px rgba(255, 239, 77, 0.28);
    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-black flex justify-center items-center m-0 p-0 w-screen h-screen">
<!-- Mobile Viewport: 390px x 844px strict container -->
<main class="w-[390px] h-[844px] max-h-[844px] bg-black text-on-surface flex flex-col justify-between px-4 pt-4 pb-8 box-border relative overflow-hidden">
<!-- Top Bar: Task-focused Back Button (Shell navigation strictly suppressed) -->
<header class="w-full flex items-center justify-between h-10 z-20">
<button aria-label="밤하늘로 돌아가기" class="flex items-center justify-center w-10 h-10 text-on-surface hover:text-primary-fixed transition-colors duration-150 active:scale-95 rounded-none" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Subtle Framing Technical Reticle Top-Right -->
</header>
<!-- Center Content Canvas: 9:16 Card Preview Anchor -->
<section class="flex flex-col items-center justify-center flex-1 w-full my-auto z-10">
<!-- 9:16 Card Container (250px × 444px, rounded-xl 12px) -->
<article class="w-[250px] h-[444px] card-gradient rounded-xl border border-[rgba(124,130,141,0.3)] flex flex-col overflow-hidden relative shadow-2xl transition-transform duration-300" style="box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.7);">
<!-- Top 2/3: Celestial Night Sky Canvas with 1 solitary star -->
<div class="relative w-full h-[296px] flex items-center justify-center overflow-hidden">
<!-- Moonlight Ambience: Multi-layered Luminous Halos -->
<div class="absolute w-[260px] h-[260px] outer-halo-radial pointer-events-none"></div>
<div class="absolute w-[160px] h-[160px] halo-radial pointer-events-none"></div>
<!-- Delicate Concentric Golden Orbital / Ripple Rings -->
<div class="absolute w-[190px] h-[190px] rounded-full border border-[#FFEF4D]/10 pointer-events-none"></div>
<div class="absolute w-[130px] h-[130px] rounded-full border border-[#FFEF4D]/15 pointer-events-none"></div>
<div class="absolute w-[76px] h-[76px] rounded-full border border-[#FFEF4D]/25 pointer-events-none"></div>
<!-- Solitary Concentrated Moonlit Star (The 1 Completed Set) -->
<div class="relative z-10 flex items-center justify-center pointer-events-none"><span class="w-1 h-1 rounded-full bg-[#FFFFFF] shadow-[0_0_6px_2px_rgba(255,239,77,0.65)]"></span></div>
<!-- Technical Corner Hairline Markings inside Card Top Area -->
</div>
<!-- Hairline Thin Divider Line -->
<div class="w-full h-[1px] bg-[#7C828D]/25"></div>
<!-- Bottom 1/3: Centered Session Metrics & Identity -->
<div class="w-full h-[147px] flex flex-col items-center justify-between py-4 px-3 text-center bg-[#0e141c]/40 backdrop-blur-sm">
<div class="flex flex-col items-center justify-center space-y-1 mt-1">
<!-- Large Bold Session Set Label -->
<h1 class="text-on-surface text-[26px] leading-[30px] font-bold tracking-tight">
<span class="font-num font-bold text-[28px] mr-0.5 text-on-surface">1</span>세트
            </h1>
<!-- Secondary Focused Duration Label -->
<p class="text-secondary text-[13px] leading-[18px] font-normal tracking-wide">
              총 <span class="font-num text-[13px] font-medium text-secondary">25</span>분 집중
            </p>
</div>
<!-- Brand Identity Anchor -->
<footer class="mb-0.5">
<span class="font-label-sm text-[11px] tracking-[0.2em] text-outline font-medium">별도로</span>
</footer>
</div>
</article>
<!-- Subtitle Indicator Below Card -->
<p class="mt-4 text-[12px] font-label-sm text-secondary font-medium tracking-wide">
        9:16 카드 미리보기
      </p>
</section>
<!-- Bottom Action Area: Brutalist Architectural Yellow Button with Crosshairs -->
<div class="w-full flex justify-center pb-2 z-20">
<div class="relative w-[358px]">
<!-- Tactile Brutalist Corner Hairline '+' Crosshairs (Zero border-radius framing) -->
<span class="absolute -top-[5px] -left-[5px] text-[#FFEF4D] font-mono text-[10px] leading-none pointer-events-none select-none">+</span>
<span class="absolute -top-[5px] -right-[5px] text-[#FFEF4D] font-mono text-[10px] leading-none pointer-events-none select-none">+</span>
<span class="absolute -bottom-[5px] -left-[5px] text-[#FFEF4D] font-mono text-[10px] leading-none pointer-events-none select-none">+</span>
<span class="absolute -bottom-[5px] -right-[5px] text-[#FFEF4D] font-mono text-[10px] leading-none pointer-events-none select-none">+</span>
<!-- Primary Moonlight Button -->
<button class="w-full h-[52px] bg-primary-fixed text-black font-bold text-[16px] tracking-wide flex items-center justify-center rounded-none transition-transform active:scale-[0.99] duration-100 btn-glow focus:outline-none" type="button">
          이미지 저장
        </button>
</div>
</div>
