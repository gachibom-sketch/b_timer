<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별도로 - 밤하늘 (0세트)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,600;0,700;1,700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-num {
      font-family: 'Archivo Narrow', sans-serif;
      font-feature-settings: "tnum";
    }
    .crosshair-corner {
      position: relative;
    }
    .crosshair-corner::before,
    .crosshair-corner::after {
      content: '';
      position: absolute;
      pointer-events: none;
    }
    /* Corner cross marks */
    .cross-top-left {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-top-right {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-bottom-left {
      position: absolute;
      bottom: -8px;
      left: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-bottom-right {
      position: absolute;
      bottom: -8px;
      right: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-mark {
      stroke: #FFEF4D;
      stroke-width: 1.5;
    }
    .glow-yellow {
      box-shadow: 0 0 16px rgba(255, 239, 77, 0.5);
    }
    .glow-text {
      text-shadow: 0 0 10px rgba(255, 239, 77, 0.4);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen relative selection:bg-[#FFEF4D] selection:text-black">

  <!-- Desktop App Container (1440 max / 720 center content) -->
  <div class="w-full max-w-[1440px] min-h-[900px] flex flex-col justify-between items-center px-6 py-8 relative">

    <!-- Top Navigation Tabs (Centered within layout) -->
    <header class="w-full max-w-[720px] pt-4 pb-12 flex justify-center items-center">
      <nav class="flex items-center space-x-12 text-lg font-medium tracking-wide">
        <!-- 타이머 탭 (비활성) -->
        <a href="#" class="text-[#7C828D] hover:text-[#949AA6] transition-colors pb-2 cursor-pointer">
          타이머
        </a>
        <!-- 밤하늘 탭 (활성: 노란 글자 + 노란 밑줄 + 빛 번짐) -->
        <a href="#" class="text-[#FFEF4D] font-bold pb-2 relative flex flex-col items-center glow-text cursor-default">
          <span>밤하늘</span>
          <span class="absolute bottom-0 w-full h-[2.5px] bg-[#FFEF4D] glow-yellow rounded-full"></span>
        </a>
      </nav>
    </header>

    <!-- Main Content Area: Width 720px, Vertical Stack -->
    <main class="w-full max-w-[720px] flex flex-col items-stretch space-y-7 my-auto pb-8">
      
      <!-- 1. 밤하늘 판 (360px 높이, 모서리 살짝 둥글게, 그라데이션) -->
      <section 
        aria-label="별이 뜨는 밤하늘" 
        class="w-full h-[360px] rounded-xl relative overflow-hidden flex items-center justify-center border border-[#23272F]/60"
        style="background: linear-gradient(180deg, #0F1216 0%, #171C23 60%, #23272F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);"
      >
        <!-- 별이 0개인 빈 밤하늘 - 안내 문구 -->
        <div class="text-center px-4 select-none">
          <p class="text-[#7C828D] text-base md:text-lg font-normal tracking-wide">
            첫 세트를 마치면 별이 떠요
          </p>
        </div>
      </section>

      <!-- 2. 한 줄 통계 텍스트 -->
      <div class="text-center pt-1 pb-1">
        <p class="text-lg md:text-xl text-[#949AA6] font-medium tracking-tight">
          누적 <span class="text-[#EEF0F3] font-bold font-num text-2xl mx-0.5">0</span>세트 · 총 <span class="text-[#EEF0F3] font-bold font-num text-2xl mx-0.5">0</span>분 집중
        </p>
      </div>

      <!-- 3. 버튼 영역 -->
      <div class="flex flex-col space-y-4 pt-2">
        
        <!-- 주 단추: 꽉 찬 노란 직사각형, 각진 모서리, 검고 굵은 글자, 네 모서리 바깥 "+" 십자 표시 -->
        <div class="relative w-full">
          <!-- 4 Corner Crosshairs -->
          <svg class="cross-top-left" viewBox="0 0 12 12" fill="none">
            <line x1="6" y1="0" x2="6" y2="12" class="cross-mark" />
            <line x1="0" y1="6" x2="12" y2="6" class="cross-mark" />
          </svg>
          <svg class="cross-top-right" viewBox="0 0 12 12" fill="none">
            <line x1="6" y1="0" x2="6" y2="12" class="cross-mark" />
            <line x1="0" y1="6" x2="12" y2="6" class="cross-mark" />
          </svg>
          <svg class="cross-bottom-left" viewBox="0 0 12 12" fill="none">
            <line x1="6" y1="0" x2="6" y2="12" class="cross-mark" />
            <line x1="0" y1="6" x2="12" y2="6" class="cross-mark" />
          </svg>
          <svg class="cross-bottom-right" viewBox="0 0 12 12" fill="none">
            <line x1="6" y1="0" x2="6" y2="12" class="cross-mark" />
            <line x1="0" y1="6" x2="12" y2="6" class="cross-mark" />
          </svg>

          <button 
            type="button" 
            class="w-full h-14 bg-[#FFEF4D] hover:bg-[#fff26a] active:bg-[#ebd936] text-[#000000] font-bold text-lg tracking-wider rounded-none transition-colors flex items-center justify-center cursor-pointer shadow-lg"
          >
            다음 세트 시작
          </button>
        </div>

        <!-- 보조 단추: 바탕 없이 #7C828D 얇은 테두리, 누를 수 없는 비활성 상태 (opacity & disabled) -->
        <button 
          type="button" 
          disabled
          aria-disabled="true"
          class="w-full h-14 bg-transparent border border-[#7C828D]/30 text-[#7C828D]/50 font-medium text-lg tracking-wide rounded-none flex items-center justify-center cursor-not-allowed select-none"
        >
          카드 만들기
        </button>

        <!-- 작고 덜 눈에 띄는 글 단추: 시연 모드 -->
        <div class="flex justify-center pt-2">
          <button 
            type="button" 
            class="text-xs text-[#7C828D] hover:text-[#949AA6] transition-colors underline-offset-4 hover:underline py-1 px-3 cursor-pointer"
          >
            시연 모드
          </button>
        </div>

      </div>

    </main>

    <!-- Empty Footer Spacer for Centering Balance -->
    <div class="h-6"></div>

    <!-- Floating Chatbot Button (Bottom Right) -->
    <aside class="fixed bottom-8 right-8 z-50">
      <button 
        type="button" 
        aria-label="상담 챗봇 열기"
        class="w-14 h-14 rounded-full bg-[#23272F] hover:bg-[#2C323C] border border-[#7C828D]/30 shadow-2xl flex items-center justify-center text-2xl transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer text-[#EEF0F3]"
      >
        <span role="img" aria-label="로봇">🤖</span>
      </button>
    </aside>

  </div>

</body>
</html>
