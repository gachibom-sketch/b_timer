<!DOCTYPE html>

<html lang="ko" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>별모도로 - 목표 선택</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandYellow: '#FFEF4D',
            brandDark: '#000000',
            brandSlate: '#23272F',
            brandMuted: '#7C828D',
            brandText: '#EEF0F3',
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['"Archivo Narrow"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>
<!-- CSS Styles -->
<style data-purpose="custom-layout">
    /* Prevent default elastic scrolling & assure 390x844 mobile viewport */
    html, body {
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #app-container {
      width: 390px;
      height: 844px;
      max-height: 844px;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    /* Tab glow styling */
    .active-tab-glow {
      box-shadow: 0 0 12px rgba(255, 239, 77, 0.45);
    }

    /* Ambient Dial Glow */
    .dial-halo-glow {
      filter: blur(28px);
      background: radial-gradient(circle, rgba(255, 239, 77, 0.16) 0%, rgba(255, 239, 77, 0.05) 50%, transparent 70%);
    }

    /* Diagonal stripe pattern for 5-min rest section */
    .rest-stripe-pattern {
      fill: url(#diagonalHatch);
    }

    /* Precision crosshair corner markers for primary button */
    .crosshair-corner {
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      color: #FFEF4D;
    }
    .crosshair-tl { top: -6px; left: -6px; }
    .crosshair-tr { top: -6px; right: -6px; }
    .crosshair-bl { bottom: -6px; left: -6px; }
    .crosshair-br { bottom: -6px; right: -6px; }
  </style>
</head>
<body>
<!-- BEGIN: MainContainer -->
<div class="flex flex-col justify-between items-center px-4 py-0" data-purpose="mobile-screen-wrapper" id="app-container"><!-- Top Header & Card Selection Section -->
<div class="w-full max-w-[358px] flex flex-col flex-1 min-h-0 overflow-hidden pt-3">
<!-- Header Section -->
<nav class="w-full flex items-center justify-center gap-8 mb-4 flex-shrink-0 pt-2"><button class="text-[16px] font-medium text-[#949AA6] pb-1 cursor-pointer transition-colors focus:outline-none" type="button">타이머</button><button class="text-[16px] font-medium text-[#949AA6] pb-1 cursor-pointer transition-colors focus:outline-none" type="button">밤하늘</button></nav><div class="flex flex-col mb-4 flex-shrink-0">
<h1 class="text-[24px] font-bold text-[#EEF0F3] leading-snug tracking-normal">목표를 정해 주세요</h1>
<p class="text-[14px] text-[#949AA6] mt-1 tracking-normal">세트를 마칠 때마다 별자리가 조금씩 차올라요</p>
</div>
<!-- Constellation Selection Cards List -->
<div class="flex flex-col gap-4 w-full flex-1 overflow-y-auto pr-0.5 pb-2">
<!-- Card 1: 카시오페이아자리 (Unselected) -->
<div class="w-full rounded-2xl p-3 flex items-center justify-between cursor-pointer border border-[#7C828D]/45 hover:border-[#7C828D] transition-colors flex-shrink-0" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%); min-height: 128px;">
<div class="flex items-center gap-3.5 flex-1">
<div class="w-[104px] h-[104px] rounded-xl flex items-center justify-center flex-shrink-0 border border-[#2B303A] relative overflow-hidden" style="background: linear-gradient(135deg, #0E1430 0%, #1C2650 100%);">
<svg class="w-full h-full" fill="none" viewbox="0 0 104 104" xmlns="http://www.w3.org/2000/svg">
<polyline fill="none" points="18,40 36,68 52,44 70,72 86,38" stroke="rgba(200,210,230,0.45)" stroke-width="1.5"></polyline>
<circle cx="18" cy="40" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="36" cy="68" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="52" cy="44" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="70" cy="72" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="86" cy="38" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
</svg>
</div>
<div class="flex-1 min-w-0 flex flex-col justify-center"><div class="text-[18px] font-bold text-[#EEF0F3] leading-tight truncate" style="white-space: nowrap;">카시오페이아자리</div><div class="text-[14px] font-medium text-[#949AA6] leading-tight mt-2 truncate" style="white-space: nowrap;">하루 2세트 · 약 1시간</div></div>
</div>
</div>
<!-- Card 2: 오리온자리 (SELECTED) -->
<div class="w-full rounded-2xl p-3 flex items-center justify-between cursor-pointer border-2 border-[#FFEF4D] shadow-[0_0_16px_rgba(255,239,77,0.15)] flex-shrink-0 relative" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%); min-height: 128px;"><div class="flex items-center gap-3.5 flex-1 min-w-0 pr-2"><div class="w-[104px] h-[104px] rounded-xl flex items-center justify-center flex-shrink-0 border border-[#FFEF4D]/50 relative overflow-hidden" style="background: linear-gradient(135deg, #0E1430 0%, #1C2650 100%);"><svg class="w-full h-full" fill="none" viewbox="0 0 104 104" xmlns="http://www.w3.org/2000/svg"><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="30" x2="74" y1="24" y2="24"></line><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="30" x2="44" y1="24" y2="52"></line><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="74" x2="60" y1="24" y2="52"></line><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="44" x2="60" y1="52" y2="52"></line><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="44" x2="32" y1="52" y2="80"></line><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="60" x2="72" y1="52" y2="80"></line><line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="1.5" x1="32" x2="72" y1="80" y2="80"></line><circle cx="44" cy="52" fill="#FFEF4D" filter="drop-shadow(0 0 3px #FFEF4D)" r="3"></circle><circle cx="52" cy="52" fill="#FFEF4D" filter="drop-shadow(0 0 3px #FFEF4D)" r="2.8"></circle><circle cx="60" cy="52" fill="#FFEF4D" filter="drop-shadow(0 0 3px #FFEF4D)" r="3"></circle><circle cx="30" cy="24" fill="#FF7A7A" filter="drop-shadow(0 0 5px #FF7A7A)" r="4.5"></circle><circle cx="74" cy="24" fill="#FFEF4D" filter="drop-shadow(0 0 3px #FFEF4D)" r="3.5"></circle><circle cx="32" cy="80" fill="#FFEF4D" filter="drop-shadow(0 0 3px #FFEF4D)" r="3.5"></circle><circle cx="72" cy="80" fill="#7AB8FF" filter="drop-shadow(0 0 5px #7AB8FF)" r="4.5"></circle></svg></div><div class="flex-1 min-w-0 flex flex-col justify-center"><div class="text-[18px] font-bold text-[#EEF0F3] leading-tight truncate" style="white-space: nowrap;">오리온자리</div><div class="mt-1.5 flex"><span class="border border-[#FFEF4D] text-[11px] text-[#FFEF4D] font-medium rounded px-2 py-0.5 leading-none inline-block" style="white-space: nowrap;">처음이라면 추천</span></div><div class="text-[14px] font-medium text-[#949AA6] leading-tight mt-1.5 truncate" style="white-space: nowrap;">하루 3세트 · 약 1시간 30분</div></div></div><div class="w-[28px] h-[28px] rounded-full bg-[#FFEF4D] flex items-center justify-center flex-shrink-0 shadow-[0_0_8px_rgba(255,239,77,0.5)]"><svg fill="none" height="10" viewbox="0 0 14 10" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 5.2L4.8 8.5L12.5 1.5" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg></div></div>
<!-- Card 3: 북두칠성 (Unselected) -->
<div class="w-full rounded-2xl p-3 flex items-center justify-between cursor-pointer border border-[#7C828D]/45 hover:border-[#7C828D] transition-colors flex-shrink-0" style="background: linear-gradient(135deg, #0F1216 0%, #23272F 100%); min-height: 128px;">
<div class="flex items-center gap-3.5 flex-1">
<div class="w-[104px] h-[104px] rounded-xl flex items-center justify-center flex-shrink-0 border border-[#2B303A] relative overflow-hidden" style="background: linear-gradient(135deg, #0E1430 0%, #1C2650 100%);">
<svg class="w-full h-full" fill="none" viewbox="0 0 104 104" xmlns="http://www.w3.org/2000/svg">
<!-- Curved handle and 4-star bowl -->
<polyline fill="none" points="16,30 30,42 46,50 62,54 82,50 84,74 65,76 62,54" stroke="rgba(200,210,230,0.45)" stroke-width="1.5"></polyline>
<circle cx="16" cy="30" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="30" cy="42" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="46" cy="50" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="62" cy="54" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="82" cy="50" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="84" cy="74" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
<circle cx="65" cy="76" fill="#FFFFFF" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" r="3.5"></circle>
</svg>
</div>
<div class="flex-1 min-w-0 flex flex-col justify-center"><div class="text-[18px] font-bold text-[#EEF0F3] leading-tight truncate" style="white-space: nowrap;">북두칠성</div><div class="text-[14px] font-medium text-[#949AA6] leading-tight mt-2 truncate" style="white-space: nowrap;">한 주 7세트 · 하루 1세트씩</div></div>
</div>
</div>
</div>
</div>
<!-- Bottom Primary CTA Button Section -->
<div class="w-full max-w-[358px] pt-2 pb-6 flex flex-col items-center flex-shrink-0">
<div class="relative w-full h-[52px]">
<!-- Nocturne Focus Corner Plus (+) Indicators -->
<span aria-hidden="true" class="crosshair-corner crosshair-tl">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-tr">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-bl">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-br">+</span>
<!-- Main CTA Button -->
<button class="w-full h-full bg-[#FFEF4D] text-[#000000] font-bold text-[16px] tracking-normal flex items-center justify-center rounded-none active:bg-[#e6d843] transition-colors focus:outline-none cursor-pointer" type="button">이 목표로 정하기</button>
</div>
</div></div>
<!-- END: MainContainer -->
</body></html>
