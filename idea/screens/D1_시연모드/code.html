<!DOCTYPE html>

<html lang="ko" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>별도로 - 밤하늘 (시연 모드 23세트)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,600;0,700;1,700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-num {
      font-family: 'Archivo Narrow', sans-serif;
      font-feature-settings: "tnum";
    }
    .crosshair-corner {
      position: relative;
    }
    .crosshair-corner::before,
    .crosshair-corner::after {
      content: '';
      position: absolute;
      pointer-events: none;
    }
    /* Corner cross marks */
    .cross-top-left {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-top-right {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-bottom-left {
      position: absolute;
      bottom: -8px;
      left: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-bottom-right {
      position: absolute;
      bottom: -8px;
      right: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-mark {
      stroke: #FFEF4D;
      stroke-width: 1.5;
    }
    .glow-yellow {
      box-shadow: 0 0 16px rgba(255, 239, 77, 0.5);
    }
    .glow-text {
      text-shadow: 0 0 10px rgba(255, 239, 77, 0.4);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between w-full h-[844px] max-w-[390px] mx-auto overflow-hidden relative selection:bg-[#FFEF4D] selection:text-black">
<!-- Desktop App Container (1440 max / 720 center content) -->
<div class="w-full h-full flex flex-col justify-between items-center px-4 pt-6 pb-6 relative">
<!-- Top Navigation Tabs (Centered within layout) -->
<header class="w-full max-w-[358px] pt-2 pb-4 flex justify-center items-center">
<nav class="flex items-center space-x-12 text-lg font-medium tracking-wide">
<!-- 타이머 탭 (비활성) -->
<a class="text-[#7C828D] hover:text-[#949AA6] transition-colors pb-2 cursor-pointer" href="#">
          타이머
        </a>
<!-- 밤하늘 탭 (활성: 노란 글자 + 노란 밑줄 + 빛 번짐) -->
<a class="text-[#FFEF4D] font-bold pb-2 relative flex flex-col items-center glow-text cursor-default" href="#">
<span class="">밤하늘</span>
<span class="absolute bottom-0 w-full h-[2.5px] bg-[#FFEF4D] glow-yellow rounded-full"></span>
</a>
</nav>
</header>
<!-- Main Content Area: Width 720px, Vertical Stack -->
<main class="w-full max-w-[358px] flex flex-col items-stretch space-y-4 my-auto pb-2"><!-- 1. 밤하늘 판 (높이 260px, 모서리 둥글게, 그라데이션) -->
<section aria-label="별이 뜨는 밤하늘" class="w-full h-[260px] rounded-xl relative overflow-hidden border border-[#7C828D]/30 select-none" style="background: linear-gradient(180deg, #0F1216 0%, #171C23 60%, #23272F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);">
<!-- 23세트: 중간별 2개 (각 10세트) + 작은별 3개 (각 1세트) -->
<!-- 중간별 1 (14px 4각 별, 부드러운 후광) -->
<div class="absolute" style="top: 55px; left: 88px;">
<div class="absolute -inset-2 bg-[#FFF9A6]/20 rounded-full blur-[6px]"></div>
<svg class="relative w-[14px] h-[14px] drop-shadow-[0_0_8px_rgba(255,249,166,0.9)]" fill="#FFF9A6" viewbox="0 0 24 24">
<path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"></path>
</svg>
</div>
<!-- 중간별 2 (14px 4각 별) -->
<div class="absolute" style="top: 95px; right: 80px;">
<div class="absolute -inset-2 bg-[#FFF9A6]/20 rounded-full blur-[6px]"></div>
<svg class="relative w-[14px] h-[14px] drop-shadow-[0_0_8px_rgba(255,249,166,0.9)]" fill="#FFF9A6" viewbox="0 0 24 24">
<path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"></path>
</svg>
</div>
<!-- 작은별 1 (6px 원형 발광점) -->
<div class="absolute" style="top: 140px; left: 62px;">
<div class="absolute -inset-1 bg-[#EEF0F3]/30 rounded-full blur-[3px]"></div>
<div class="relative w-[5px] h-[5px] bg-[#EEF0F3] rounded-full shadow-[0_0_6px_rgba(238,240,243,0.9)]"></div>
</div>
<!-- 작은별 2 (6px 원형 발광점) -->
<div class="absolute" style="top: 70px; left: 200px;">
<div class="absolute -inset-1 bg-[#FFF9A6]/30 rounded-full blur-[3px]"></div>
<div class="relative w-[5px] h-[5px] bg-[#FFF9A6] rounded-full shadow-[0_0_6px_rgba(255,249,166,0.9)]"></div>
</div>
<!-- 작은별 3 (6px 원형 발광점) -->
<div class="absolute" style="top: 185px; right: 105px;">
<div class="absolute -inset-1 bg-[#EEF0F3]/30 rounded-full blur-[3px]"></div>
<div class="relative w-[6px] h-[6px] bg-[#EEF0F3] rounded-full shadow-[0_0_6px_rgba(238,240,243,0.9)]"></div>
</div>
</section>
<!-- 2. 시연 모드 박스 (점선 테두리 상자) -->
<div class="w-full border border-dashed border-[#7C828D]/60 bg-[#0F1216]/70 p-3 rounded-none relative flex flex-col space-y-2.5">
<div class="flex items-center justify-between text-xs">
<span class="text-[#FFEF4D] font-bold tracking-wider">시연 모드</span>
<span class="text-[#7C828D] text-[11px]">세트 수 직접 지정</span>
</div>
<!-- 누적 세트 수 입력 필드 -->
<div class="relative w-full flex items-center">
<input class="w-full h-[38px] bg-[#000000] border border-[#7C828D]/50 text-[#EEF0F3] font-num text-lg font-bold px-3 py-1 rounded-none outline-none focus:border-[#FFEF4D] transition-colors" placeholder="누적 세트 수" type="number" value="23"/>
<span class="absolute right-3 text-[#7C828D] text-sm pointer-events-none font-medium">세트</span>
</div>
<!-- 빠른 설정 단추 4개 행 -->
<div class="grid grid-cols-4 gap-2 pt-0.5">
<button class="h-[30px] border border-[#7C828D]/60 bg-transparent text-[#EEF0F3] font-num text-sm hover:border-[#949AA6] transition-colors rounded-none flex items-center justify-center cursor-pointer" type="button">9</button>
<button class="h-[30px] border border-[#FFEF4D] bg-[#FFEF4D]/10 text-[#FFEF4D] font-num font-bold text-sm shadow-[0_0_8px_rgba(255,239,77,0.25)] rounded-none flex items-center justify-center cursor-pointer" type="button">23</button>
<button class="h-[30px] border border-[#7C828D]/60 bg-transparent text-[#EEF0F3] font-num text-sm hover:border-[#949AA6] transition-colors rounded-none flex items-center justify-center cursor-pointer" type="button">150</button>
<button class="h-[30px] border border-[#7C828D]/60 bg-transparent text-[#EEF0F3] font-num text-sm hover:border-[#949AA6] transition-colors rounded-none flex items-center justify-center cursor-pointer" type="button">1000</button>
</div>
</div>
<!-- 3. 한 줄 통계 텍스트 -->
<div class="text-center py-0.5">
<p class="text-base md:text-lg text-[#949AA6] font-medium tracking-tight">
    누적 <span class="text-[#EEF0F3] font-bold font-num text-xl md:text-2xl mx-0.5">23</span>세트 · 총 <span class="text-[#EEF0F3] font-bold font-num text-xl md:text-2xl mx-0.5">9</span>시간 <span class="text-[#EEF0F3] font-bold font-num text-xl md:text-2xl mx-0.5">35</span>분 집중
  </p>
</div>
<!-- 4. 버튼 영역 -->
<div class="flex flex-col space-y-3 pt-1">
<!-- 주 단추: 꽉 찬 노란 직사각형, 네 모서리 바깥 "+" 십자 표시 -->
<div class="relative w-full">
<svg class="cross-top-left" fill="none" viewbox="0 0 12 12">
<line class="cross-mark" x1="6" x2="6" y1="0" y2="12"></line>
<line class="cross-mark" x1="0" x2="12" y1="6" y2="6"></line>
</svg>
<svg class="cross-top-right" fill="none" viewbox="0 0 12 12">
<line class="cross-mark" x1="6" x2="6" y1="0" y2="12"></line>
<line class="cross-mark" x1="0" x2="12" y1="6" y2="6"></line>
</svg>
<svg class="cross-bottom-left" fill="none" viewbox="0 0 12 12">
<line class="cross-mark" x1="6" x2="6" y1="0" y2="12"></line>
<line class="cross-mark" x1="0" x2="12" y1="6" y2="6"></line>
</svg>
<svg class="cross-bottom-right" fill="none" viewbox="0 0 12 12">
<line class="cross-mark" x1="6" x2="6" y1="0" y2="12"></line>
<line class="cross-mark" x1="0" x2="12" y1="6" y2="6"></line>
</svg>
<button class="w-full h-[52px] bg-[#FFEF4D] hover:bg-[#fff26a] active:bg-[#ebd936] text-[#000000] font-bold text-lg tracking-wider rounded-none transition-colors flex items-center justify-center cursor-pointer shadow-lg" type="button">
      다음 세트 시작
    </button>
</div>
<!-- 보조 단추: 활성화된 상태 (클릭 가능, 밝은 글씨, 얇은 테두리) -->
<button class="w-full h-[52px] bg-transparent border border-[#7C828D] text-[#EEF0F3] hover:border-[#EEF0F3] active:bg-[#ffffff]/5 font-medium text-lg tracking-wide rounded-none flex items-center justify-center cursor-pointer transition-colors" type="button">
    카드 만들기
  </button>
<!-- 시연 모드 끄기 버튼 -->
<div class="flex justify-center pt-1">
<button class="text-xs text-[#949AA6] hover:text-[#EEF0F3] transition-colors underline-offset-4 hover:underline py-1 px-3 cursor-pointer" type="button">
      시연 모드 끄기
    </button>
</div>
</div></main>
<!-- Empty Footer Spacer for Centering Balance -->
</div>
</body></html>
