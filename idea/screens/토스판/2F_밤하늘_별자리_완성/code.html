<!DOCTYPE html>

<html lang="ko" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>별모도로 - 밤하늘 (7세트)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,600;0,700;1,700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-num {
      font-family: 'Archivo Narrow', sans-serif;
      font-feature-settings: "tnum";
    }
    .crosshair-corner {
      position: relative;
    }
    .crosshair-corner::before,
    .crosshair-corner::after {
      content: '';
      position: absolute;
      pointer-events: none;
    }
    /* Corner cross marks */
    .cross-top-left {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-top-right {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-bottom-left {
      position: absolute;
      bottom: -8px;
      left: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-bottom-right {
      position: absolute;
      bottom: -8px;
      right: -8px;
      width: 12px;
      height: 12px;
      pointer-events: none;
    }
    .cross-mark {
      stroke: #FFEF4D;
      stroke-width: 1.5;
    }
    .glow-yellow {
      box-shadow: 0 0 16px rgba(255, 239, 77, 0.5);
    }
    .glow-text {
      text-shadow: 0 0 10px rgba(255, 239, 77, 0.4);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between w-full max-w-[390px] mx-auto relative selection:bg-[#FFEF4D] selection:text-black" style="font-family: 'Noto Sans KR', sans-serif; background-color: #FFFFFF; color: #191F28; margin: 0; padding: 0; width: 100vw; min-height: 100vh; overflow-x: hidden;">
<!-- Desktop App Container (1440 max / 720 center content) -->
<div class="w-full min-h-screen flex flex-col justify-between items-center px-4 pt-0 pb-24 relative bg-[#FFFFFF]">
<!-- Top Navigation Tabs (Centered within layout) -->
<header class="w-full max-w-[358px] h-[54px] flex items-center justify-between bg-white border-b border-[#F2F4F6] shrink-0"><div class="flex items-center space-x-2"><button class="text-[#191F28] flex items-center justify-center p-1 -ml-1 cursor-pointer" type="button"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button><div class="w-6 h-6 rounded-[6px] bg-[#0E1430] flex items-center justify-center shrink-0"><svg class="w-3.5 h-3.5 text-[#FFEF4D]" fill="currentColor" viewbox="0 0 24 24"><path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z"></path></svg></div><span class="text-[17px] font-semibold text-[#191F28] tracking-tight">별모도로</span></div><div class="flex items-center space-x-3 text-[#191F28]"><button class="p-1 text-[#191F28] cursor-pointer" type="button"><svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button><button class="p-1 text-[#191F28] cursor-pointer" type="button"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></svg></button></div></header>
<!-- Main Content Area: Width 720px, Vertical Stack -->
<main class="w-full max-w-[358px] flex flex-col items-stretch space-y-4 my-auto pb-2">
<!-- 1. 밤하늘 판 (360px 높이, 모서리 살짝 둥글게, 그라데이션) -->
<section aria-label="별이 뜨는 밤하늘" class="w-full h-[320px] rounded-[20px] relative overflow-hidden flex items-center justify-center shadow-md" style="background: linear-gradient(180deg, #0E1430 0%, #151D3E 50%, #1C2650 100%); box-shadow: 0 4px 20px rgba(14, 20, 48, 0.15);"><!-- Connecting Constellation Lines SVG overlay -->
<svg class="absolute inset-0 w-full h-full pointer-events-none overflow-visible" preserveaspectratio="none" style="filter: drop-shadow(0 0 3px rgba(255, 239, 77, 0.5));" viewbox="0 0 100 100">
<!-- 1. Betelgeuse (30, 22) to Bellatrix (70, 25) -->
<line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="0.45" x1="30" x2="70" y1="22" y2="25"></line>
<!-- 2. Betelgeuse (30, 22) to Alnitak (42, 48) -->
<line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="0.45" x1="30" x2="42" y1="22" y2="48"></line>
<!-- 3. Bellatrix (70, 25) to Mintaka (58, 52) -->
<line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="0.45" x1="70" x2="58" y1="25" y2="52"></line>
<!-- 4. Belt: Alnitak (42, 48) to Alnilam (50, 50) and Alnilam (50, 50) to Mintaka (58, 52) -->
<line stroke="#FFEF4D" stroke-opacity="0.85" stroke-width="0.45" x1="42" x2="50" y1="48" y2="50"></line>
<line stroke="#FFEF4D" stroke-opacity="0.85" stroke-width="0.45" x1="50" x2="58" y1="50" y2="52"></line>
<!-- 5. Alnitak (42, 48) down to Saiph (34, 76) -->
<line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="0.45" x1="42" x2="34" y1="48" y2="76"></line>
<!-- 6. Mintaka (58, 52) down to Rigel (68, 74) -->
<line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="0.45" x1="58" x2="68" y1="52" y2="74"></line>
<!-- 7. Saiph (34, 76) to Rigel (68, 74) -->
<line stroke="#FFEF4D" stroke-opacity="0.75" stroke-width="0.45" x1="34" x2="68" y1="76" y2="74"></line>
</svg>
<!-- 1. Upper Left (Betelgeuse): fully lit bright 4-point sparkle with reddish-orange tint (#FF8A50) -->
<div class="absolute pointer-events-none" style="left: 30%; top: 22%; transform: translate(-50%, -50%);">
<svg class="w-5 h-5" fill="none" style="filter: drop-shadow(0 0 10px rgba(255, 138, 80, 0.95)) drop-shadow(0 0 18px rgba(255, 112, 67, 0.8));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#FF8A50"></path>
</svg>
</div>
<!-- 2. Upper Right (Bellatrix): fully lit bright 4-point sparkle with warm white/yellow glow -->
<div class="absolute pointer-events-none" style="left: 70%; top: 25%; transform: translate(-50%, -50%);">
<svg class="w-5 h-5" fill="none" style="filter: drop-shadow(0 0 10px rgba(237, 246, 255, 0.95)) drop-shadow(0 0 16px rgba(255, 239, 77, 0.8));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#FFF9A6"></path>
</svg>
</div>
<!-- Bonus Star (덤 별): soft white dot floating near upper right of Orion -->
<div class="absolute pointer-events-none flex items-center justify-center" style="left: 82%; top: 16%; transform: translate(-50%, -50%);">
<div class="w-1.5 h-1.5 rounded-full bg-white opacity-80" style="box-shadow: 0 0 6px rgba(255, 255, 255, 0.7);"></div>
</div>
<!-- 3. Belt Left (Alnitak): fully lit bright 4-point sparkle (#FFEF4D) -->
<div class="absolute pointer-events-none" style="left: 42%; top: 48%; transform: translate(-50%, -50%);">
<svg class="w-4 h-4" fill="none" style="filter: drop-shadow(0 0 8px rgba(255, 239, 77, 0.95)) drop-shadow(0 0 14px rgba(255, 249, 166, 0.8));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#FFEF4D"></path>
</svg>
</div>
<!-- 4. Belt Center (Alnilam): fully lit bright 4-point sparkle (#FFEF4D) -->
<div class="absolute pointer-events-none" style="left: 50%; top: 50%; transform: translate(-50%, -50%);">
<svg class="w-4 h-4" fill="none" style="filter: drop-shadow(0 0 8px rgba(255, 239, 77, 0.95)) drop-shadow(0 0 14px rgba(255, 249, 166, 0.8));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#FFEF4D"></path>
</svg>
</div>
<!-- 5. Belt Right (Mintaka): fully lit bright 4-point sparkle (#FFEF4D) -->
<div class="absolute pointer-events-none" style="left: 58%; top: 52%; transform: translate(-50%, -50%);">
<svg class="w-4 h-4" fill="none" style="filter: drop-shadow(0 0 8px rgba(255, 239, 77, 0.95)) drop-shadow(0 0 14px rgba(255, 249, 166, 0.8));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#FFEF4D"></path>
</svg>
</div>
<!-- 6. Lower Left (Saiph): fully lit soft sparkle -->
<div class="absolute pointer-events-none" style="left: 34%; top: 76%; transform: translate(-50%, -50%);">
<svg class="w-4 h-4" fill="none" style="filter: drop-shadow(0 0 8px rgba(255, 239, 77, 0.9)) drop-shadow(0 0 12px rgba(255, 249, 166, 0.7));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#FFF9A6"></path>
</svg>
</div>
<!-- 7. Lower Right (Rigel): fully lit bright sparkle with blue-white halo / soft cyan tint -->
<div class="absolute pointer-events-none" style="left: 68%; top: 74%; transform: translate(-50%, -50%);">
<svg class="w-5 h-5" fill="none" style="filter: drop-shadow(0 0 10px rgba(165, 222, 255, 0.95)) drop-shadow(0 0 18px rgba(120, 195, 255, 0.85));" viewbox="0 0 24 24">
<path d="M12 0L14.2 9.2L24 12L14.2 14.8L12 24L9.8 14.8L0 12L9.8 9.2L12 0Z" fill="#E3F2FD"></path>
</svg>
</div></section>
<!-- 2. 한 줄 통계 텍스트 -->
<div class="text-center pt-2 pb-1"><p class="text-[18px] font-bold text-[#191F28] tracking-tight flex items-center justify-center space-x-1 mb-1"><span>오리온자리</span><span class="bg-[#FFF0A0] text-[#7A5C00] font-bold text-[14px] px-1.5 py-0.5 rounded-[4px] mx-1">완성</span><span>· 덤 별 1개 · 오늘</span></p><p class="text-[14px] text-[#6B7684] font-medium tracking-normal mt-1">누적 <span class="text-[#191F28] font-bold">9</span>세트 · 총 <span class="text-[#191F28] font-bold">3</span>시간 <span class="text-[#191F28] font-bold">45</span>분 집중</p></div>
<!-- 3. 버튼 영역 -->
<div class="flex flex-col space-y-3 pt-2 w-full"><button class="w-full h-14 bg-[#FFE14D] hover:bg-[#fedb35] active:bg-[#f2ce23] text-[#191F28] font-bold text-[17px] rounded-2xl transition-colors flex items-center justify-center cursor-pointer shadow-sm" type="button">다음 세트 시작</button><button class="w-full h-14 bg-[#F2F4F6] hover:bg-[#E5E8EB] active:bg-[#D1D6DB] text-[#333D4B] font-semibold text-[16px] rounded-2xl transition-colors flex items-center justify-center cursor-pointer" type="button">카드 만들기</button></div><!-- 지난 별자리 History Section -->
<section aria-label="지난 별자리 내역" class="w-full pt-4"><h2 class="text-[15px] font-bold text-[#6B7684] mb-3 tracking-normal">지난 별자리</h2><div class="flex flex-col space-y-2.5"><div class="w-full rounded-2xl bg-white border border-[#E5E8EB] p-4 flex items-center justify-between shadow-sm"><div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-[#0E1430] flex items-center justify-center p-1.5 shrink-0"><svg class="w-6 h-6 overflow-visible" fill="none" viewbox="0 0 24 24"><polyline points="3,8 7,16 12,10 17,16 21,9" stroke="#FFEF4D" stroke-opacity="0.9" stroke-width="1.5"></polyline><circle cx="3" cy="8" fill="#FFF9A6" r="1.6"></circle><circle cx="7" cy="16" fill="#FFF9A6" r="1.6"></circle><circle cx="12" cy="10" fill="#FFF9A6" r="1.6"></circle><circle cx="17" cy="16" fill="#FFF9A6" r="1.6"></circle><circle cx="21" cy="9" fill="#FFF9A6" r="1.6"></circle></svg></div><div class="flex flex-col text-left"><span class="text-[16px] font-bold text-[#191F28] leading-tight">카시오페이아자리</span><span class="text-[13px] text-[#8B95A1] leading-normal mt-0.5">10월 28일</span></div></div><span class="bg-[#FFF0A0] text-[#7A5C00] rounded-full px-2.5 py-1 text-xs font-bold">완성</span></div><div class="w-full rounded-2xl bg-white border border-[#E5E8EB] p-4 flex items-center justify-between shadow-sm"><div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-[#0E1430] flex items-center justify-center p-1.5 shrink-0"><svg class="w-6 h-6 overflow-visible" fill="none" viewbox="0 0 24 24"><circle cx="12" cy="4" fill="#FFF9A6" opacity="0.95" r="1.6"></circle><circle cx="5" cy="11" fill="#FFF9A6" opacity="0.85" r="1.4"></circle><circle cx="12" cy="12" fill="#FFEF4D" opacity="0.95" r="1.6"></circle><circle cx="19" cy="11" fill="#4E5968" opacity="0.5" r="1.4"></circle><circle cx="12" cy="20" fill="#4E5968" opacity="0.5" r="1.4"></circle></svg></div><div class="flex flex-col text-left"><span class="text-[16px] font-bold text-[#191F28] leading-tight">백조자리</span><span class="text-[13px] text-[#8B95A1] leading-normal mt-0.5">10월 27일</span></div></div><span class="text-[14px] font-medium text-[#6B7684]">3/5세트</span></div></div></section>
</main>
<!-- Empty Footer Spacer for Centering Balance -->
<!-- Floating Chatbot Button (Bottom Right) -->
<nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 w-[calc(100%-32px)] max-w-[358px] h-16 rounded-full bg-white shadow-[0_4px_20px_rgba(0,0,0,0.08)] border border-[#E5E8EB] flex items-center justify-around px-4 z-50"><a class="flex flex-col items-center justify-center flex-1 py-1 text-[#8B95A1] hover:text-[#4E5968] transition-colors" href="#"><svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="14" r="8"></circle><line x1="12" x2="12" y1="14" y2="10"></line><line x1="12" x2="12" y1="2" y2="4"></line></svg><span class="text-[11px] font-medium">타이머</span></a><a class="flex flex-col items-center justify-center flex-1 py-1 text-[#191F28]" href="#"><svg class="w-5 h-5 mb-1 text-[#191F28]" fill="currentColor" viewbox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg><span class="text-[11px] font-bold">밤하늘</span></a></nav></div>
</body></html>
