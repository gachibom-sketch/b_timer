<style>
    /* Custom Hatch Stripe Pattern for break period */
    .break-stripes {
      background: repeating-linear-gradient(
        -45deg,
        #111726,
        #111726 5px,
        #FFEF4D 5px,
        #FFEF4D 7px
      );
    }
    
    .moonlight-glow {
      box-shadow: 0 0 28px -2px rgba(255, 239, 77, 0.32);
    }

    .moonlight-glow-tab {
      box-shadow: 0 2px 8px rgba(255, 239, 77, 0.45);
    }

    /* Modal Gradient */
    .modal-panel-bg {
      background: linear-gradient(180deg, #0F1216 0%, #23272F 100%);
    }

    /* Plus Corner Reticles */
    .cross-tl { top: -3px; left: -3px; }
    .cross-tr { top: -3px; right: -3px; }
    .cross-bl { bottom: -3px; left: -3px; }
    .cross-br { bottom: -3px; right: -3px; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-[#F2F4F6] text-[#191F28] antialiased select-none overflow-hidden m-0 p-0 flex justify-center items-center h-screen w-screen">
<!-- Mobile Viewport Canvas: 390x844px -->
<main class="relative w-[390px] h-[844px] max-h-[844px] bg-white overflow-hidden flex flex-col justify-between font-['Noto_Sans_KR',sans-serif]">
<!-- Top Toss Navigation Bar (54px) -->
<header class="w-full h-[54px] px-4 flex items-center justify-between border-b border-[#F2F4F6] bg-white z-10 shrink-0">
<div class="flex items-center gap-2">
<button class="text-[#191F28] flex items-center justify-center p-1 -ml-1 active:opacity-60" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<div class="w-6 h-6 rounded-md bg-[#0E1430] flex items-center justify-center shadow-xs">
<span class="material-symbols-outlined text-[#FFEF4D] text-[15px]">star</span>
</div>
<span class="text-[17px] font-semibold text-[#191F28] tracking-tight">별모도로</span>
</div>
<div class="flex items-center gap-1 text-[#191F28]">
<button class="p-1.5 flex items-center justify-center rounded-full hover:bg-[#F2F4F6] active:opacity-60" type="button">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
<button class="p-1.5 flex items-center justify-center rounded-full hover:bg-[#F2F4F6] active:opacity-60" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</header>
<!-- Timer Page Content behind dialog -->
<div class="relative flex-1 flex flex-col items-center justify-between px-6 pt-5 pb-28">
<!-- Goal & Session Status Header -->
<div class="w-full flex items-center justify-center"><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1C2650] text-[#FFE14D] text-xs font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-[#FFE14D]"></span>집중 중</div></div>
<!-- Dial Container on White -->
<div class="relative w-[240px] h-[240px] flex items-center justify-center my-auto">
<svg class="w-[240px] h-[240px] -rotate-90 transform" viewbox="0 0 240 240"><circle cx="120" cy="120" fill="#0E1430" r="104"></circle><path d="M 120 120 L 170 206.6 A 100 100 0 0 1 33.4 70 Z" fill="#FFE14D"></path><path d="M 120 120 L 33.4 70 A 100 100 0 0 1 220 120 Z" fill="#0E1430"></path><path d="M 120 120 L 220 120 A 100 100 0 0 1 170 206.6 Z" fill="#576CC4"></path><circle cx="120" cy="120" fill="#FFFFFF" r="7"></circle><circle cx="120" cy="120" fill="#191F28" r="2.5"></circle></svg>
</div>
<!-- Large Digital Timer & Subtext -->
<div class="flex flex-col items-center mb-6">
<div class="text-[60px] font-bold tracking-tight text-[#191F28] font-['Archivo_Narrow',sans-serif] leading-none tabular-nums">
        12 : 30
      </div>
</div>
<!-- Secondary Button Under Timer -->
<button class="w-full h-[52px] bg-[#F2F4F6] text-[#333D4B] font-semibold text-[15px] rounded-[16px] flex items-center justify-center hover:bg-[#E5E8EB] active:scale-[0.99] transition-all" type="button">
      그만하기
    </button>
</div>
<!-- Toss-Style Floating Bottom Tab Bar -->
<nav class="absolute bottom-3 left-4 right-4 h-[64px] bg-white rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.08)] border border-[#F2F4F6] flex items-center justify-around px-8 z-10">
<div class="flex flex-col items-center justify-center gap-0.5 text-[#191F28]">
<span class="material-symbols-outlined text-[22px]">timer</span>
<span class="text-[11px] font-bold">타이머</span>
</div>
<div class="flex flex-col items-center justify-center gap-0.5 text-[#6B7684]"><svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><span class="text-[11px] font-medium">밤하늘</span></div>
</nav>
<!-- Toss Dimmed Modal Overlay -->
<div class="absolute inset-0 bg-black/40 z-20"></div>
<!-- Toss Centered Confirmation Dialog -->
<div class="absolute inset-0 z-30 flex items-center justify-center px-6 pointer-events-none">
<div class="pointer-events-auto w-full max-w-[340px] bg-white rounded-[24px] p-6 shadow-[0_12px_36px_rgba(0,0,0,0.14)] flex flex-col items-center text-center">

<div class="w-12 h-12 rounded-full bg-[#1C2650] flex items-center justify-center mb-4 text-[#FFE14D]"><span class="material-symbols-outlined text-[26px]">bedtime</span></div>

<h2 class="text-[20px] font-bold text-[#191F28] leading-[1.35] tracking-tight mb-6">이번 세트는 별이 되지 않아요</h2>

<!-- Action Buttons -->
<div class="flex items-center gap-2.5 w-full">
<!-- Secondary Button: 그만하기 -->
<button class="flex-1 h-[52px] bg-[#F2F4F6] text-[#333D4B] font-semibold text-[16px] rounded-[16px] flex items-center justify-center hover:bg-[#E5E8EB] active:scale-[0.98] transition-all" type="button">
          그만하기
        </button>
<!-- Primary Button: 계속하기 -->
<button class="flex-1 h-[52px] bg-[#1C2650] text-[#FFE14D] font-bold text-[16px] rounded-[16px] flex items-center justify-center hover:bg-[#0E1430] active:scale-[0.98] transition-all" type="button">계속하기</button>
</div>
</div>
</div>
