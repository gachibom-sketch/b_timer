<!DOCTYPE html>

<html lang="ko" style=""><head>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandYellow: '#FFEF4D',
            brandDark: '#000000',
            brandSlate: '#23272F',
            brandMuted: '#7C828D',
            brandText: '#EEF0F3',
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],

<!-- CSS Styles -->
<style data-purpose="custom-layout">
    /* Prevent default elastic scrolling & assure 390x844 mobile viewport */
    html, body {
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #app-container {
      width: 390px;
      height: 844px;
      max-height: 844px;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    /* Tab glow styling */
    .active-tab-glow {
      box-shadow: 0 0 12px rgba(255, 239, 77, 0.45);
    }

    /* Ambient Dial Glow */
    .dial-halo-glow {
      filter: blur(28px);
      background: radial-gradient(circle, rgba(255, 239, 77, 0.16) 0%, rgba(255, 239, 77, 0.05) 50%, transparent 70%);
    }

    /* Diagonal stripe pattern for 5-min rest section */
    .rest-stripe-pattern {
      fill: url(#diagonalHatch);
    }

    /* Precision crosshair corner markers for primary button */
    .crosshair-corner {
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      color: #FFEF4D;
    }
    .crosshair-tl { top: -6px; left: -6px; }
    .crosshair-tr { top: -6px; right: -6px; }
    .crosshair-bl { bottom: -6px; left: -6px; }
    .crosshair-br { bottom: -6px; right: -6px; }
  </style>
</head>
<body style="background-color: #FFFFFF; color: #191F28;">
