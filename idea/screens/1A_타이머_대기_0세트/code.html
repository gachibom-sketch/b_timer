<!DOCTYPE html>

<html lang="ko" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>별도로 - 타이머</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandYellow: '#FFEF4D',
            brandDark: '#000000',
            brandSlate: '#23272F',
            brandMuted: '#7C828D',
            brandText: '#EEF0F3',
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['"Archivo Narrow"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>
<!-- CSS Styles -->
<style data-purpose="custom-layout">
    /* Prevent default elastic scrolling & assure 390x844 mobile viewport */
    html, body {
      background-color: #000000;
      color: #EEF0F3;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #app-container {
      width: 390px;
      height: 844px;
      max-height: 844px;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    /* Tab glow styling */
    .active-tab-glow {
      box-shadow: 0 0 12px rgba(255, 239, 77, 0.45);
    }

    /* Ambient Dial Glow */
    .dial-halo-glow {
      filter: blur(28px);
      background: radial-gradient(circle, rgba(255, 239, 77, 0.16) 0%, rgba(255, 239, 77, 0.05) 50%, transparent 70%);
    }

    /* Diagonal stripe pattern for 5-min rest section */
    .rest-stripe-pattern {
      fill: url(#diagonalHatch);
    }

    /* Precision crosshair corner markers for primary button */
    .crosshair-corner {
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      color: #FFEF4D;
    }
    .crosshair-tl { top: -6px; left: -6px; }
    .crosshair-tr { top: -6px; right: -6px; }
    .crosshair-bl { bottom: -6px; left: -6px; }
    .crosshair-br { bottom: -6px; right: -6px; }
  </style>
</head>
<body>
<!-- BEGIN: MainContainer -->
<div class="flex flex-col justify-between items-center px-4 py-0" data-purpose="mobile-screen-wrapper" id="app-container">
<!-- BEGIN: TopSection -->
<div class="w-full flex flex-col items-center pt-6" data-purpose="top-navigation-and-status">
<!-- Top Navigation Tabs (Screen 2 exact style) -->
<nav aria-label="메인 탭" class="flex items-center justify-center gap-10 w-full" data-purpose="top-tab-navigation">
<!-- Active Tab: 타이머 -->
<button class="relative pb-2 flex flex-col items-center group cursor-pointer" data-purpose="tab-timer-active" type="button">
<span class="text-[19px] font-bold text-brandYellow tracking-tight leading-none">타이머</span>
<div class="absolute bottom-0 w-full h-[2.5px] bg-brandYellow active-tab-glow"></div>
</button>
<!-- Inactive Tab: 밤하늘 -->
<button class="relative pb-2 flex flex-col items-center cursor-pointer" data-purpose="tab-sky-inactive" type="button">
<span class="text-[19px] font-semibold text-brandMuted tracking-tight leading-none hover:text-gray-400 transition-colors">밤하늘</span>
<div class="absolute bottom-0 w-full h-[2.5px] bg-transparent"></div>
</button>
</nav>
<!-- Idle Status Badge: ● 대기 -->
<div class="w-full max-w-[358px] relative flex items-center justify-center mt-7" data-purpose="timer-status-badge-row">
<div class="flex items-center gap-2" data-purpose="timer-status-badge">
<span class="inline-block w-2 h-2 rounded-full bg-brandYellow shadow-[0_0_8px_#FFEF4D]"></span>
<span class="text-sm font-medium tracking-wide text-[#949AA6]">대기</span>
</div>
<button aria-label="도움말" class="absolute right-0 w-7 h-7 rounded-full border border-[#7C828D] flex items-center justify-center text-[#7C828D] hover:text-[#EEF0F3] hover:border-[#EEF0F3] text-xs font-medium bg-transparent transition-colors cursor-pointer" type="button">
    ?
  </button>
</div>
</div>
<!-- END: TopSection -->
<!-- BEGIN: TimerDialSection -->
<div class="relative flex items-center justify-center w-[250px] h-[250px] my-auto" data-purpose="timer-visual-clock">
<!-- Soft ambient yellow halo glow behind dial -->
<div class="absolute inset-[-20px] rounded-full dial-halo-glow pointer-events-none"></div>
<!-- Clock Face SVG (Exact 240px Diameter) -->
<svg class="relative z-10 w-[240px] h-[240px] drop-shadow-2xl" data-purpose="clock-dial-svg" fill="none" viewbox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><defs>
<pattern height="8" id="diagonalHatch" patterntransform="rotate(45 0 0)" patternunits="userSpaceOnUse" width="8">
<line stroke="#FFEF4D" stroke-opacity="0.7" stroke-width="1.5" x1="0" x2="0" y1="0" y2="8"></line>
</pattern>
</defs>
<!-- Base Outer Circle Background -->
<circle cx="120" cy="120" fill="#181B20" r="116"></circle>
<!-- 300° Focus Sector (25 Minutes: Moonlight yellow section from 2 o'clock / 60° clockwise to 12 o'clock / 360°) -->
<path d="M 120 120 L 220.45 62 A 116 116 0 1 1 120 4 Z" fill="#FFEF4D"></path>
<!-- 60° Rest Sector (5 Minutes: 12 o'clock 0° to 2 o'clock 60°): Navy #23272F with yellow hatched stripes -->
<path d="M 120 120 L 120 4 A 116 116 0 0 1 220.45 62 Z" fill="#23272F"></path>
<path class="rest-stripe-pattern" d="M 120 120 L 120 4 A 116 116 0 0 1 220.45 62 Z"></path>
<!-- Border around the circle -->
<circle cx="120" cy="120" r="116" stroke="#2B303A" stroke-width="2"></circle>
<!-- Clock Face Tick Marks (12 Ticks around perimeter) -->
<!-- 12 o'clock (0°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2.5" x1="120" x2="120" y1="4" y2="18"></line>
<!-- 1 o'clock (30°) -->
<line stroke="#FFEF4D" stroke-linecap="round" stroke-opacity="0.6" stroke-width="2" x1="178" x2="171" y1="19.5" y2="31.6"></line>
<!-- 2 o'clock (60°) - Division point -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2.5" x1="220.4" x2="208.3" y1="62" y2="69"></line>
<!-- 3 o'clock (90°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="236" x2="222" y1="120" y2="120"></line>
<!-- 4 o'clock (120°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="220.4" x2="208.3" y1="178" y2="171"></line>
<!-- 5 o'clock (150°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="178" x2="171" y1="220.5" y2="208.4"></line>
<!-- 6 o'clock (180°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="120" x2="120" y1="236" y2="222"></line>
<!-- 7 o'clock (210°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="62" x2="69" y1="220.5" y2="208.4"></line>
<!-- 8 o'clock (240°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="19.5" x2="31.7" y1="178" y2="171"></line>
<!-- 9 o'clock (270°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="4" x2="18" y1="120" y2="120"></line>
<!-- 10 o'clock (300°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="19.5" x2="31.7" y1="62" y2="69"></line>
<!-- 11 o'clock (330°) -->
<line stroke="#181B20" stroke-linecap="round" stroke-width="2" x1="62" x2="69" y1="19.5" y2="31.6"></line>
<!-- Sector Separator Lines -->
<line stroke="#181B20" stroke-width="2.5" x1="120" x2="220.45" y1="120" y2="62"></line>
<line stroke="#181B20" stroke-width="2.5" x1="120" x2="120" y1="120" y2="4"></line>
<!-- Central Pivot Axis & Ring -->
<circle cx="120" cy="120" fill="#181B20" r="11" stroke="#FFEF4D" stroke-width="3"></circle>
<circle cx="120" cy="120" fill="#FFEF4D" r="3.5"></circle></svg>
</div>
<!-- END: TimerDialSection -->
<!-- BEGIN: TimerValueAndStatsSection -->
<div class="w-full flex flex-col items-center justify-center -mt-2 mb-6" data-purpose="time-display-and-sets">
<!-- Huge High-Contrast Time Numbers -->
<div class="font-mono text-[64px] font-bold tracking-tight text-brandText leading-none select-none drop-shadow-sm" data-purpose="digital-countdown-display">
        25 : 00
      </div>
<!-- Cumulative Sets Indicator -->
<p class="mt-3 text-[13.5px] font-medium text-[#949AA6] tracking-tight leading-normal" data-purpose="timer-onboarding-caption">25분 집중하고 5분 쉬면 밤하늘에 별이 떠요</p>
</div>
<!-- END: TimerValueAndStatsSection -->
<!-- BEGIN: BottomControlsSection -->
<div class="w-full pb-9 flex flex-col items-center" data-purpose="bottom-action-container">
<!-- Primary Sharp Rectangular Button (358px × 52px) with Corner Crosshairs -->
<div class="relative w-[358px] h-[52px]" data-purpose="primary-action-wrapper">
<!-- Corner Plus (+) Indicators matching Screen 2 style -->
<span aria-hidden="true" class="crosshair-corner crosshair-tl">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-tr">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-bl">+</span>
<span aria-hidden="true" class="crosshair-corner crosshair-br">+</span>
<!-- Main '시작' Button (100% square corners) -->
<button class="w-full h-full bg-brandYellow text-black font-extrabold text-[18px] tracking-wider flex items-center justify-center rounded-none active:bg-[#e6d843] transition-colors focus:outline-none cursor-pointer" data-purpose="timer-start-button" type="button">
          시작
        </button>
</div>
</div>
<!-- END: BottomControlsSection -->
</div>
<!-- END: MainContainer -->
</body></html>
