<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>별도로 - 집중 타이머</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,600;0,700;1,600;1,700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "tertiary-container": "#e1e2e8",
            "primary-container": "#f5e644",
            "surface-container-highest": "#2f353f",
            "tertiary": "#ffffff",
            "on-error-container": "#ffdad6",
            "surface": "#0e141c",
            "secondary": "#c3c6d1",
            "on-error": "#690005",
            "tertiary-fixed": "#e1e2e8",
            "outline-variant": "#4a4734",
            "surface-bright": "#333a43",
            "on-surface-variant": "#ccc7ad",
            "on-secondary": "#2c3039",
            "on-primary-fixed": "#1f1c00",
            "primary-fixed-dim": "#d8c926",
            "background": "#0e141c",
            "on-background": "#dde3ef",
            "on-tertiary-fixed-variant": "#44474c",
            "inverse-primary": "#686000",
            "inverse-surface": "#dde3ef",
            "on-primary": "#363100",
            "surface-container-low": "#161c25",
            "inverse-on-surface": "#2b313a",
            "secondary-fixed": "#dfe2ed",
            "on-secondary-fixed-variant": "#434750",
            "surface-container": "#1a2029",
            "secondary-fixed-dim": "#c3c6d1",
            "surface-tint": "#d8c926",
            "surface-container-lowest": "#080f17",
            "primary-fixed": "#f5e644",
            "surface-container-high": "#242a33",
            "tertiary-fixed-dim": "#c5c6cc",
            "on-tertiary": "#2e3135",
            "outline": "#95917a",
            "primary": "#ffffff",
            "on-primary-container": "#6e6600",
            "surface-variant": "#2f353f",
            "secondary-container": "#434750",
            "on-secondary-container": "#b2b5bf",
            "error-container": "#93000a",
            "error": "#ffb4ab",
            "surface-dim": "#0e141c",
            "on-tertiary-container": "#626469",
            "on-primary-fixed-variant": "#4e4800",
            "on-surface": "#dde3ef",
            "on-secondary-fixed": "#181c23",
            "on-tertiary-fixed": "#191c20",
            "nocturne-yellow": "#FFEF4D",
            "nocturne-slate": "#7C828D",
            "nocturne-muted": "#949AA6",
            "nocturne-bright": "#EEF0F3"
          },
          fontFamily: {
            "label-sm": ["Noto Sans KR", "sans-serif"],
            "headline-md": ["Noto Sans KR", "sans-serif"],
            "display-timer-mobile": ["Archivo Narrow", "sans-serif"],
            "body-lg": ["Noto Sans KR", "sans-serif"],
            "headline-lg": ["Noto Sans KR", "sans-serif"],
            "display-timer": ["Archivo Narrow", "sans-serif"],
            "title-sm": ["Archivo Narrow", "sans-serif"],
            "label-numeric": ["Archivo Narrow", "sans-serif"],
            "body-md": ["Noto Sans KR", "sans-serif"]
          },
          fontSize: {
            "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
            "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "display-timer-mobile": ["64px", { lineHeight: "64px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "body-lg": ["16px", { lineHeight: "26px", fontWeight: "400" }],
            "headline-lg": ["28px", { lineHeight: "36px", fontWeight: "700" }],
            "display-timer": ["112px", { lineHeight: "104px", letterSpacing: "-0.04em", fontWeight: "700" }],
            "title-sm": ["16px", { lineHeight: "22px", letterSpacing: "0.08em", fontWeight: "600" }],
            "label-numeric": ["13px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }]
          }
        }
      }
    };
  </script>
<style>
    /* Custom Hatch Stripe Pattern for break period */
    .break-stripes {
      background: repeating-linear-gradient(
        -45deg,
        #111726,
        #111726 5px,
        #FFEF4D 5px,
        #FFEF4D 7px
      );
    }
    
    .moonlight-glow {
      box-shadow: 0 0 28px -2px rgba(255, 239, 77, 0.32);
    }

    .moonlight-glow-tab {
      box-shadow: 0 2px 8px rgba(255, 239, 77, 0.45);
    }

    /* Modal Gradient */
    .modal-panel-bg {
      background: linear-gradient(180deg, #0F1216 0%, #23272F 100%);
    }

    /* Plus Corner Reticles */
    .cross-tl { top: -3px; left: -3px; }
    .cross-tr { top: -3px; right: -3px; }
    .cross-bl { bottom: -3px; left: -3px; }
    .cross-br { bottom: -3px; right: -3px; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-black text-[#EEF0F3] antialiased select-none overflow-hidden m-0 p-0 flex justify-center items-center h-screen w-screen">
<!-- Mobile Viewport Canvas: 390x844px -->
<main class="relative w-[390px] h-[844px] max-h-[844px] bg-black overflow-hidden flex flex-col justify-between">
<!-- Hairline Reticle Grid Elements for Brutalist Aesthetic -->
<div class="pointer-events-none absolute inset-0 z-0">
<div class="absolute left-4 top-0 bottom-0 w-px bg-[#7C828D]/15"></div>
<div class="absolute right-4 top-0 bottom-0 w-px bg-[#7C828D]/15"></div>
<div class="absolute top-14 left-0 right-0 h-px bg-[#7C828D]/20"></div>
</div>
<!-- BACKGROUND CONTENT LAYER (Under darkened overlay) -->
<div class="relative z-10 flex flex-col h-full w-full justify-between pb-8 pt-0">
<!-- Top Navigation Tabs (Shared style context: 타이머 | 밤하늘) -->
<header class="w-full pt-4 px-6 flex flex-col items-center">
<!-- Top status bar spacing -->
<div class="w-full flex items-center justify-between text-[#949AA6] text-[11px] font-label-numeric tracking-widest uppercase mb-3">
<span class="flex items-center gap-1.5 text-nocturne-yellow font-bold tracking-wider">
<span class="material-symbols-outlined text-[14px]">nightlight</span>
            별도로
          </span>
<span class="tracking-widest opacity-60">SESSION 03 / 04</span>
</div>
<nav class="flex items-center gap-6 relative mt-1">
<!-- Active Tab: 타이머 -->
<div class="flex flex-col items-center">
<span class="text-nocturne-yellow font-semibold text-sm tracking-widest pb-1.5 cursor-default">타이머</span>
<div class="w-full h-[2px] bg-nocturne-yellow moonlight-glow-tab rounded-none"></div>
</div>
<!-- Hairline Divider -->
<span class="text-[#7C828D]/40 text-xs">|</span>
<!-- Inactive Tab: 밤하늘 -->
<div class="flex flex-col items-center">
<span class="text-nocturne-muted font-medium text-sm tracking-widest pb-1.5 opacity-60 hover:opacity-100 transition-opacity cursor-default">밤하늘</span>
<div class="w-full h-[2px] bg-transparent"></div>
</div>
</nav>
</header>
<!-- Center Focus Dial & Timers -->
<section class="flex flex-col items-center justify-center flex-1 w-full px-6 -mt-3">
<!-- Status Pill: "집중" with Glowing Yellow Dot -->
<div class="mb-6 flex items-center gap-2 px-3 py-1 bg-[#0F1216] border border-[#7C828D]/40 rounded-none">
<span class="w-2 h-2 rounded-full bg-nocturne-yellow moonlight-glow"></span>
<span class="text-nocturne-bright text-xs font-medium tracking-wide">집중</span>
</div>
<!-- Circular Dial Container (240px x 240px) -->
<div class="relative w-[240px] h-[240px] flex items-center justify-center">
<!-- Outer Hairline Halo Ring -->
<div class="absolute inset-0 rounded-full border border-[#7C828D]/25"></div>
<!-- SVG Precision Circular Pie Dial -->
<svg class="w-[230px] h-[230px] -rotate-90 transform" viewbox="0 0 240 240">
<defs>
<!-- Striped Hatch Pattern for 5-minute break (0° to 60°) -->
<pattern height="6" id="hatch-stripes" patterntransform="rotate(45 0 0)" patternunits="userSpaceOnUse" width="6">
<line stroke="#FFEF4D" stroke-width="1.8" x1="0" x2="0" y1="0" y2="6"></line>
<line stroke="#0a101d" stroke-width="4.2" x1="0" x2="6" y1="0" y2="0"></line>
</pattern>
<!-- Radial Soft Moonlight Ambient Glow -->
<radialgradient cx="50%" cy="50%" id="dialGlow" r="50%">
<stop offset="60%" stop-color="#FFEF4D" stop-opacity="0.1"></stop>
<stop offset="100%" stop-color="#FFEF4D" stop-opacity="0"></stop>
</radialgradient>
</defs>
<!-- Base Dial Track / Passed time (210° to 360°) -->
<circle cx="120" cy="120" fill="#080F17" r="100" stroke="#7C828D" stroke-opacity="0.3" stroke-width="1"></circle>
<!-- Remaining Focus Slice: 60° to 210° (150 degrees arc) -->
<!-- Path calculation for 150 deg slice from 60° to 210° (radius 100, center 120,120) -->
<!-- 60 deg: x=120+100*cos(60)=170, y=120+100*sin(60)=206.6 -->
<!-- 210 deg: x=120+100*cos(210)=33.4, y=120+100*sin(210)=70 -->
<path d="M 120 120 L 170 206.6 A 100 100 0 0 1 33.4 70 Z" fill="#FFEF4D"></path>
<!-- 5-min Break Slice: 0° to 60° (60 degrees arc) with diagonal hatch stripes -->
<!-- 0 deg: x=220, y=120 -->
<!-- 60 deg: x=170, y=206.6 -->
<path d="M 120 120 L 220 120 A 100 100 0 0 1 170 206.6 Z" fill="url(#hatch-stripes)" stroke="#FFEF4D" stroke-width="0.75"></path>
<!-- Empty Passed Time Segment Border Edge Lines -->
<line stroke="#7C828D" stroke-opacity="0.6" stroke-width="1.2" x1="120" x2="220" y1="120" y2="120"></line>
<line stroke="#FFEF4D" stroke-width="1.5" x1="120" x2="33.4" y1="120" y2="70"></line>
<!-- Subdued Moonlight Glow Layer -->
<circle cx="120" cy="120" fill="url(#dialGlow)" pointer-events="none" r="95"></circle>
<!-- Dial Perimeter Tick Marks (Every 30 degrees = 5 min intervals) -->
<g opacity="0.4" stroke="#000000" stroke-width="1.5">
<line x1="120" x2="120" y1="20" y2="28"></line>
<line x1="206.6" x2="199.7" y1="70" y2="74"></line>
<line x1="220" x2="212" y1="120" y2="120"></line>
<line x1="206.6" x2="199.7" y1="170" y2="166"></line>
<line x1="170" x2="166" y1="206.6" y2="199.7"></line>
<line x1="120" x2="120" y1="220" y2="212"></line>
<line x1="70" x2="74" y1="206.6" y2="199.7"></line>
<line x1="33.4" x2="40.3" y1="170" y2="166"></line>
<line x1="20" x2="28" y1="120" y2="120"></line>
<line x1="33.4" x2="40.3" y1="70" y2="74"></line>
<line x1="70" x2="74" y1="33.4" y2="40.3"></line>
</g>
<!-- Center Yellow Pivot Pin -->
<circle cx="120" cy="120" fill="#000000" r="6" stroke="#FFEF4D" stroke-width="2.5"></circle>
<circle cx="120" cy="120" fill="#FFEF4D" r="2"></circle>
</svg>
<!-- Reticle Ghost Corner Crosshairs for Brutalist Framing -->
<span class="absolute top-0 left-0 text-[#7C828D]/30 text-[9px] font-mono leading-none">+</span>
<span class="absolute top-0 right-0 text-[#7C828D]/30 text-[9px] font-mono leading-none">+</span>
<span class="absolute bottom-0 left-0 text-[#7C828D]/30 text-[9px] font-mono leading-none">+</span>
<span class="absolute bottom-0 right-0 text-[#7C828D]/30 text-[9px] font-mono leading-none">+</span>
</div>
<!-- Numerical Time Readout -->
<div class="mt-8 flex flex-col items-center">
<div class="font-display-timer-mobile text-display-timer-mobile tracking-tighter text-nocturne-bright tabular-nums select-all">
            12 : 30
          </div>
<div class="mt-1 flex items-center gap-1.5 text-nocturne-muted text-xs font-body-md tracking-wider">
<span>남은 시간</span>
<span class="text-nocturne-bright font-label-numeric font-semibold">12분 30초</span>
</div>
</div>
</section>
<!-- Bottom Secondary Action: "그만하기" Button -->
<footer class="w-full px-4 flex flex-col items-center">
<button class="w-full max-w-[358px] h-[52px] bg-transparent border border-nocturne-slate text-nocturne-bright font-semibold text-sm tracking-wider uppercase rounded-none hover:border-nocturne-bright hover:bg-white/5 active:scale-[0.99] transition-all flex items-center justify-center" type="button">
          그만하기
        </button>
</footer>
</div>
<!-- PURE DARK BACKDROP OVERLAY (60% darkened overlay) -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-[2px] z-20 pointer-events-auto"></div>
<!-- MODAL CONFIRMATION DIALOG (Centered, sharp 320px width) -->
<div class="absolute inset-0 z-30 flex items-center justify-center p-0 pointer-events-none">
<div class="pointer-events-auto relative w-[320px] modal-panel-bg border border-nocturne-slate p-6 rounded-none shadow-2xl">
<!-- Subtle Corner Reticle Accents on Modal -->
<span class="absolute -top-1.5 -left-1.5 text-nocturne-slate text-[10px] font-mono select-none">+</span>
<span class="absolute -top-1.5 -right-1.5 text-nocturne-slate text-[10px] font-mono select-none">+</span>
<span class="absolute -bottom-1.5 -left-1.5 text-nocturne-slate text-[10px] font-mono select-none">+</span>
<span class="absolute -bottom-1.5 -right-1.5 text-nocturne-slate text-[10px] font-mono select-none">+</span>
<!-- Dialog Content -->
<div class="flex flex-col items-center">
<!-- Star/Moonlight Icon Hint -->
<div class="mb-3 text-nocturne-yellow/80">
<span class="material-symbols-outlined text-[20px]">nightlight</span>
</div>
<!-- Heading -->
<h2 class="text-nocturne-bright font-headline-md text-center text-lg font-bold tracking-tight leading-snug mb-6">
            이번 세트는 별이 되지 않아요
          </h2>
<!-- Subtext -->
<!-- Action Buttons (Row: flex gap-3) -->
<div class="flex items-center gap-3 w-full">
<!-- Left Button: Secondary "그만하기" -->
<button class="h-11 flex-1 bg-transparent border border-nocturne-slate text-nocturne-bright font-medium text-sm rounded-none hover:border-nocturne-bright hover:bg-white/5 active:scale-95 transition-all flex items-center justify-center tracking-tight" type="button">
              그만하기
            </button>
<!-- Right Button: Primary "계속하기" with Offset Corner Crosshairs -->
<div class="relative flex-1 h-11">
<!-- Outer 4 Corner Hairline '+' Crosshairs (Brutalist Signature) -->
<span class="absolute cross-tl text-nocturne-yellow text-[9px] font-mono leading-none select-none pointer-events-none">+</span>
<span class="absolute cross-tr text-nocturne-yellow text-[9px] font-mono leading-none select-none pointer-events-none">+</span>
<span class="absolute cross-bl text-nocturne-yellow text-[9px] font-mono leading-none select-none pointer-events-none">+</span>
<span class="absolute cross-br text-nocturne-yellow text-[9px] font-mono leading-none select-none pointer-events-none">+</span>
<button class="w-full h-full bg-nocturne-yellow text-black font-bold text-sm rounded-none hover:bg-[#fff26e] active:scale-95 transition-all flex items-center justify-center tracking-tight moonlight-glow" type="button">
                계속하기
              </button>
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
